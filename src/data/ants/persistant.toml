status = "released"
sentence = "Store blobs and records by key, say which guarantees you need, and refuse a backend that cannot give them."
home = "https://github.com/ciresnave/PersistAnt"
install = "https://crates.io/crates/persistant"

[example]
lang = "rust"
source = "README.md @ ciresnave/PersistAnt 8cfd07b (the crate doc test, last hidden line dropped)"
tested = true
excerpt = false
code = '''
use persistant::{blocking::Store, Config, Need, Needs};

let store = Store::open(Config::Memory, Needs::new().with(Need::Read).with(Need::Write).with(Need::AtomicReplace))?;
store.replace("greeting", b"hello".to_vec())?;
assert_eq!(store.read("greeting")?, b"hello");
'''
