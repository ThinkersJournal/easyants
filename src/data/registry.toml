# The registry: the ONLY thing this hub keeps about the Ants (docs/CARD-FORMAT.md). It lists which repositories to
# read and how they are grouped. A card's name, sentence, status, install and example all come from the Ant's own
# `easyants-card.toml` and the tested example file it names, fetched on every build.
#
# card = "pending": the Ant does not carry the file yet, so it shows in the coming row with the sentence and status
# written here. The build warns when the file appears, and the entry then becomes card = "required".
# card = "required": the file must exist and be valid, or the build fails.
# An Ant with no `repo` has no public repository yet; nothing is fetched for it.
# The groups are a first proposal for CireSnave to rename or regroup.

[[group]]
id = "foundations"
title = "Foundations"

[[group]]
id = "web"
title = "Web and APIs"

[[group]]
id = "running"
title = "Running and shipping"

